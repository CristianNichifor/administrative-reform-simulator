name: Deploy the redirect

# This simulator now lives in CristianNichifor/romania-reforms, on /romania-reforms/administrativ/.
# What this repository publishes is a one-page redirect that carries location.hash across, so
# every scenario link already pasted somewhere still opens the scenario it was pasted for.
#
# The source stays here, and the history with it, but it is no longer what gets built. Changes
# belong in the monorepo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A redirect that points at nothing is worse than no redirect: it turns a working link
      # into a loop through a 404. Checked here so the stub cannot go live before the site it
      # forwards to.
      - name: Check the destination is live
        run: |
          url=https://cristiannichifor.github.io/romania-reforms/administrativ/
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "destination is not serving; refusing to publish the redirect"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
