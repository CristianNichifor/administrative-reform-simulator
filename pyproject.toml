[project]
name = "reform-simulator-pipeline"
version = "0.1.0"
description = "Data pipeline and reference model for the Romanian Administrative Reform Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "libpysal>=4.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyogrio>=0.9",
    "requests>=2.32",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pipeline is a plain source tree, not an installed package (see [tool.uv] below),
# so the repo root has to be importable for `from pipeline import ...` to resolve.
pythonpath = ["."]
# Determinism is a hard requirement of this project: a test that depends on dict
# ordering, set iteration order or hash seeding is a test that hides a real bug.
addopts = "-p no:randomly --strict-markers"

[tool.uv]
package = false
