<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-a mutat — Simulatorul reformei administrative</title>
    <link rel="canonical" href="https://cristiannichifor.github.io/romania-reforms/administrativ/" />
    <meta name="robots" content="noindex" />
    <!--
      The scenario is the link. Every slider position, the selected commune and every manual
      pin live in location.hash, so a redirect that drops the hash does not send someone to
      the same page — it sends them to a different map and loses the argument they were
      making. The script carries the hash and the query across; the meta refresh below is
      the no-JavaScript fallback and can only manage the bare page.
    -->
    <script>
      (function () {
        var target = 'https://cristiannichifor.github.io/romania-reforms/administrativ/';
        location.replace(target + location.search + location.hash);
      })();
    </script>
    <noscript>
      <meta
        http-equiv="refresh"
        content="0; url=https://cristiannichifor.github.io/romania-reforms/administrativ/"
      />
    </noscript>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0d10;
        color: #e8eaed;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f8fa;
          color: #14181d;
        }
      }
      a {
        color: #7fb3ff;
      }
      @media (prefers-color-scheme: light) {
        a {
          color: #1a5fd0;
        }
      }
      p {
        max-width: 32rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Simulatorul s-a mutat</h1>
      <p>
        Simulatorul reformei administrative face acum parte din
        <strong>Simulatoare de reformă</strong>. Ar trebui să fii redirecționat imediat, cu tot cu
        scenariul din link.
      </p>
      <p>
        <a href="https://cristiannichifor.github.io/romania-reforms/administrativ/"
          >Deschide simulatorul</a
        >
      </p>
    </main>
  </body>
</html>
